name: Daily MOLIT Price Sync

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Self-check
        run: |
          python3 test_collector.py
          node test_policy.js

      - name: Collect MOLIT prices
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python3 collector.py

      # 한국은행 ECOS 주담대 금리 · 주택금융공사 보금자리론 금리 · 서울시 토지거래허가구역
      - name: Collect policy data
        id: policy
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python3 policy_collector.py

      - name: Commit snapshot
        run: |
          git config user.name "LocationLab Auto-Operator Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add districts_live.json policy_live.json
          git diff --staged --quiet || git commit -m "chore(auto-sync): daily MOLIT price & policy snapshot"
          git push

      # 봇(GITHUB_TOKEN) 푸시는 Pages 재배포를 안 일으킬 수 있어 직접 요청
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds

      # 서울 허가구역 목록 등 정책 원천이 바뀌면 이슈로 알림 (GitHub이 메일로 보내줌)
      - name: Alert on policy change
        if: hashFiles('policy_alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "정책 데이터 변경 감지 $(date +%F) — 규칙 확인 필요" --body-file policy_alert.md

      - name: Fail if policy collection failed
        if: steps.policy.outcome == 'failure'
        run: exit 1
